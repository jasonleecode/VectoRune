name: Core and format adapters
on: [push, pull_request]
jobs:
  macos-core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: brew install qt cmake
      - run: git submodule update --init --depth 1 tools/tilemaker
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVECTORUNE_BUILD_VIEWER=OFF -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
